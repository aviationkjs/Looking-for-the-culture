<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 문화탐방</title>
<link rel="stylesheet" href="common/tour.css">
</head>
<body>
<header class="hub-head">
  <h1>우리 가족 문화탐방</h1>
  <p>장소를 골라 그림 해설을 보고, 퀴즈를 풀어 별을 모아요!</p>
  <p class="total" id="total"></p>
</header>
<main class="cards" id="cards"></main>
<p class="toast" id="toast" hidden></p>
<script src="places.js"></script>
<script>
(() => {
  const box = document.getElementById('cards');
  const toast = document.getElementById('toast');
  const starsOf = id => { try { return +localStorage.getItem('lftc:stars:' + id) || 0; } catch (e) { return 0; } };
  let got = 0, max = 0, t;
  window.PLACES.forEach(p => {
    const s = p.ready ? starsOf(p.id) : 0;
    if (p.ready) { got += s; max += 3; }
    const card = document.createElement(p.ready ? 'a' : 'button');
    card.className = 'card' + (p.ready ? '' : ' soon');
    card.style.setProperty('--c', p.color);
    if (p.ready) card.href = p.path;
    const st = !p.ready ? '<span class="st">준비 중</span>'
      : s ? `<span class="st">${'★'.repeat(s)}<i>${'★'.repeat(3 - s)}</i></span>`
      : '<span class="st new">새로 열렸어요!</span>';
    card.innerHTML = `<span class="ic">${p.icon}</span><b>${p.name}</b><small>${p.region}</small>${st}`;
    if (!p.ready) card.onclick = () => {
      toast.textContent = p.name + ' 탐방은 곧 열려요!'; toast.hidden = false;
      clearTimeout(t); t = setTimeout(() => { toast.hidden = true; }, 2000);
    };
    box.appendChild(card);
  });
  document.getElementById('total').textContent = `모은 별 ★ ${got} / ${max}`;
})();
</script>
</body>
</html>
